[testenv]
commands=
    pip install -e .
    pytest -p no:logging --cov=merry --cov-branch --cov-report=term-missing --cov-report=xml
deps=
    pytest
    pytest-cov

[testenv:flake8]
deps=
    flake8
commands=
    flake8 --exclude=".*" src/merry tests

[testenv:zizmor]
deps=
    zizmor
commands=
    zizmor --offline .forgejo/workflows/tests.yml

[testenv:docs]
changedir=docs
deps=
    sphinx
allowlist_externals=
    make
commands=
    make html

[testenv:lint]
deps=
    flake8
    zizmor
    sphinx
allowlist_externals=
    make
commands=
    flake8 --exclude=".*" src/merry tests
    zizmor --offline .forgejo/workflows/tests.yml
    make -C docs html
