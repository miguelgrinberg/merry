[project]
name = "merry"
version = "1.0.0"
authors = [
    { name = "Miguel Grinberg", email = "miguel.grinberg@gmail.com" },
]
description = "Decorator based error parsing."
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = []

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://code.miguelgrinberg.com/miguelgrinberg/merry"
Documentation = "https://merry-py.readthedocs.io/"
"Source Code" = "https://code.miguelgrinberg.com/miguelgrinberg/merry"
"Issue Tracker" = "https://code.miguelgrinberg.com/miguelgrinberg/merry/issues"
Changelog = "https://code.miguelgrinberg.com/miguelgrinberg/merry/src/branch/main/CHANGES.md"
Funding = "https://code.miguelgrinberg.com/miguelgrinberg/merry#sponsor-this-project"

[project.optional-dependencies]
docs = [
    "sphinx",
]
dev = [
    "tox",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[build-system]
requires = [
    "setuptools>=61.2",
]
build-backend = "setuptools.build_meta"
